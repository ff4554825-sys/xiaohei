version: "3.9"

services:
  xiaohei:
    build: .
    container_name: xiaohei
    ports:
      - "3721:3721"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ~/.xiaohei:/root/.xiaohei
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3721/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
