name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --max-complexity=15 --max-line-length=120 --statistics

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --tb=short --cov=src/xiaohei --cov-report=term-missing

      - name: Test core module imports
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          modules = [
            'xiaohei.data.ticker', 'xiaohei.validation.pipeline',
            'xiaohei.control.fsm', 'xiaohei.control.event_bus',
            'xiaohei.control.governance', 'xiaohei.cognition.planner',
            'xiaohei.cognition.failure_classifier', 'xiaohei.execution.executor',
            'xiaohei.data.memory_os', 'xiaohei.runtime.agent_os',
            'xiaohei.gateway.acp', 'xiaohei.gateway.auto_update',
            'xiaohei.gateway.daemon', 'xiaohei.observability.trace',
          ]
          for m in modules:
            __import__(m)
            print(f'OK: {m}')
          print(f'All {len(modules)} modules imported')
          "

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t xiaohei .
