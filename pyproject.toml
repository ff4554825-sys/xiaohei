[project]
name = "xiaohei"
version = "1.0.0"
description = "小黑 — 状态机驱动的 Agent OS 运行时"
authors = [{name = "XiaoHei"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.dependencies]
fastapi = ">=0.110.0"
uvicorn = ">=0.28.0"
pydantic = ">=2.6.0"
loguru = ">=0.7.0"
pyyaml = ">=6.0"
python-dotenv = ">=1.0.0"
httpx = ">=0.27.0"
openai = ">=1.14.0"
numpy = ">=1.26.0"
scikit-learn = ">=1.4.0"
websockets = ">=12.0"
filelock = ">=3.13.0"
rich = ">=13.7.0"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "flake8"]
otel = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-grpc"]
acp = ["jsonrpcserver"]
all = ["xiaohei[dev,otel,acp]"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xiaohei*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 120
target-version = ["py311"]
